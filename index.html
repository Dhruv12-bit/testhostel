<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shri Samarth PG – Owner</title>
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samarth PG">
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201d;--mut:#62726e;--bd:#e1e7e5;--pri:#0f766e;--on:#fff;--red:#c2410c;--redbg:#ffedd5;--grn:#15803d;--grnbg:#dcfce7;--amb:#a16207;--ambbg:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--card:#17211f;--tx:#e8f0ee;--mut:#8fa29d;--bd:#26332f;--pri:#2dd4bf;--on:#06201c;--red:#fdba74;--redbg:#3b1d0c;--grn:#86efac;--grnbg:#10301c;--amb:#fde68a;--ambbg:#33290a}}
:root[data-theme="dark"]{--bg:#0e1514;--card:#17211f;--tx:#e8f0ee;--mut:#8fa29d;--bd:#26332f;--pri:#2dd4bf;--on:#06201c;--red:#fdba74;--redbg:#3b1d0c;--grn:#86efac;--grnbg:#10301c;--amb:#fde68a;--ambbg:#33290a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.mn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
.mn b{font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--bd);color:var(--tx)}
button.p{background:var(--pri);color:var(--on);font-weight:600}
button.wa{background:#16a34a;color:#fff;font-weight:600}
button.g{background:transparent;padding:8px 12px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.sum small{color:var(--mut);display:block;font-size:12px}
.sum b{font-size:17px}
.sum .pe b{color:var(--red)}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs button{flex:1;padding:9px 4px}
.tabs button.on{background:var(--pri);color:var(--on);font-weight:600}
.t{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:650}
.sub{color:var(--mut);font-size:13px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-p{background:var(--redbg);color:var(--red)}.c-d{background:var(--grnbg);color:var(--grn)}.c-h{background:var(--ambbg);color:var(--amb)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;padding:9px 6px;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px #0004;border-radius:99px;padding:14px 20px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar button{flex:1}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:110px}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.rem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.rem a{background:#16a34a;color:#fff;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:10px;font-size:14px}
.rem a.sent{background:var(--bd);color:var(--mut)}
.tip{font-size:12px;color:var(--mut);text-align:center;margin-top:16px}

/* App Lock Screen Overlay */
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock-box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 24px;width:min(100%,360px);text-align:center;box-shadow:0 8px 30px #0002}
.lock-icon{font-size:44px;margin-bottom:12px}
.lock-title{font-size:20px;font-weight:700;margin-bottom:6px}
.lock-desc{font-size:13px;color:var(--mut);margin-bottom:20px}
.pin-input{letter-spacing:14px;font-size:26px;text-align:center;font-weight:bold;margin-bottom:16px;padding:12px}
.sec-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--bd);padding:4px 10px;border-radius:99px;margin-bottom:14px;color:var(--mut)}
</style>
</head>
<body>

<!-- PIN Lock Screen -->
<div id="lockScreen" style="display:none">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <div class="lock-title" id="lockTitle">Samarth PG Locked</div>
    <div class="lock-desc" id="lockDesc">Enter your 4-digit Master PIN to unlock</div>
    <input type="password" id="pinInput" class="pin-input" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="••••">
    <button class="p" id="pinBtn" style="width:100%;padding:12px;font-size:16px">Unlock App</button>
  </div>
</div>

<header>
  <h1><span>🏠 Shri Samarth PG</span><span><button class="g" id="lockNow" title="Lock App">🔒</button><button class="g" id="inst" hidden>Install</button><button class="g" id="set">⚙️</button></span></h1>
  <div class="mn"><button class="g" id="prev">‹</button><b id="mlabel"></b><button class="g" id="next">›</button></div>
</header>
<div class="sum" id="sum"></div>
<div class="tabs" id="tabs"></div>
<div class="bar" id="bar"></div>
<div id="list"></div>
<p class="tip">🔒 App is protected with Master PIN. Each phone stores its own isolated database.</p>
<button class="p fab" id="add">+ Tenant</button>

<dialog id="dEdit"><h2 id="eT">Tenant</h2>
  <label>Name</label><input id="eName">
  <label>Room / Bed</label><input id="eRoom">
  <label>WhatsApp number</label><input id="ePhone" type="tel" inputmode="tel" placeholder="9876543210">
  <label>Monthly rent (₹)</label><input id="eRent" type="number" inputmode="numeric">
  <div class="row"><button id="eDel" class="g">Delete</button><button id="eCan">Cancel</button><button id="eSave" class="p">Save</button></div>
</dialog>

<dialog id="dPay"><h2 id="pT">Rent received</h2>
  <div class="sub" id="pInfo"></div>
  <label>Amount received this month (₹)</label><input id="pAmt" type="number" inputmode="numeric">
  <div class="row"><button id="pFull">Full amount</button><button id="pCan">Cancel</button><button id="pSave" class="p">Save</button></div>
</dialog>

<dialog id="dAll"><h2>Remind everyone</h2><div id="allList"></div>
  <div class="row"><button id="aClose" class="p">Close</button></div>
</dialog>

<dialog id="dSet"><h2>Settings & Security</h2>
  <label>PG name</label><input id="sPg">
  <label>Message template ({name} {month} {due} {rent} {pg})</label><textarea id="sTpl"></textarea>
  
  <div style="margin:16px 0;padding-top:12px;border-top:1px solid var(--bd)">
    <label><b>Master PIN Lock (Prevents others from opening)</b></label>
    <div style="display:flex;gap:8px;margin-top:6px">
      <input id="sPin" type="password" inputmode="numeric" maxlength="6" placeholder="Enter 4-6 digit PIN">
      <button id="sPinSet" class="p" style="white-space:nowrap">Set PIN</button>
      <button id="sPinRem" class="g" style="white-space:nowrap">Remove</button>
    </div>
    <small style="color:var(--mut);display:block;margin-top:4px">If PIN is enabled, app locks automatically when closed or minimized.</small>
  </div>

  <div class="row"><button id="sExp">Copy backup</button><button id="sImp">Restore</button></div>
  <div class="row"><button id="sCan">Cancel</button><button id="sSave" class="p">Save</button></div>
</dialog>

<script>
(function(){
var KEY='samarth_pg_owner_v1';
var DEF={pg:'Shri Samarth PG',pin:'',tpl:'Hello {name} ji 🙏\n{pg} rent for {month} is ₹{due} pending. Please pay soon. Thank you!',tenants:[],pay:{}};
var S;
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
if(!S||!S.tenants)S=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};

// PIN / Lock screen logic
var isUnlocked = !S.pin;
function checkLock(){
  if(S.pin && !isUnlocked){
    $('lockScreen').style.display = 'flex';
    $('pinInput').value = '';
    $('pinInput').focus();
  } else {
    $('lockScreen').style.display = 'none';
  }
}

$('pinBtn').onclick = function(){
  var val = $('pinInput').value.trim();
  if(!val){ alert('Please enter your PIN'); return; }
  if(val === S.pin){
    isUnlocked = true;
    $('lockScreen').style.display = 'none';
  } else {
    alert('Incorrect PIN!');
    $('pinInput').value = '';
    $('pinInput').focus();
  }
};
$('pinInput').onkeydown = function(e){ if(e.key==='Enter') $('pinBtn').click(); };

// Lock immediately when clicked
$('lockNow').onclick = function(){
  if(!S.pin){
    if(confirm('No PIN is set yet. Would you like to set a Master PIN now?')){
      $('set').click();
    }
    return;
  }
  isUnlocked = false;
  checkLock();
};

// Auto-lock when user leaves app or locks phone screen
document.addEventListener('visibilitychange', function(){
  if(document.hidden && S.pin){
    isUnlocked = false;
    checkLock();
  }
});

var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var now=new Date(),yr=now.getFullYear(),mo=now.getMonth(),tab='pending',editId=null,payId=null;
function mk(){return yr+'-'+String(mo+1).padStart(2,'0')}
function mname(){return MN[mo]+' '+yr}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function paid(t){return (S.pay[mk()]||{})[t.id]||0}
function pend(t){return Math.max(0,t.rent-paid(t))}
function phone(p){var d=String(p||'').replace(/\D/g,'').replace(/^0+/,'');return d.length===10?'91'+d:d}
function msg(t){return S.tpl.replace(/\{name\}/g,t.name).replace(/\{month\}/g,mname()).replace(/\{due\}/g,pend(t)).replace(/\{rent\}/g,t.rent).replace(/\{pg\}/g,S.pg)}
function wa(t){return 'https://wa.me/'+phone(t.phone)+'?text='+encodeURIComponent(msg(t))}
function status(t){var p=paid(t);if(pend(t)===0)return ['c-d','Paid ✓'];if(p>0)return ['c-h','Due '+inr(pend(t))];return ['c-p','Due '+inr(pend(t))]}

function render(){
  $('mlabel').textContent=mname();
  var T=S.tenants,tot=0,col=0,pe=0;
  T.forEach(function(t){tot+=t.rent;col+=Math.min(paid(t),t.rent);pe+=pend(t)});
  $('sum').innerHTML='<div><small>Total rent</small><b>'+inr(tot)+'</b></div><div><small>Received</small><b>'+inr(col)+'</b></div><div class="pe"><small>Due</small><b>'+inr(pe)+'</b></div>';
  var np=T.filter(function(t){return pend(t)>0}).length;
  $('tabs').innerHTML=[['pending','Due ('+np+')'],['paid','Paid ('+(T.length-np)+')'],['all','All ('+T.length+')']].map(function(x){return '<button data-t="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('');
  $('bar').innerHTML=np?'<button class="wa" id="remAll">📲 Remind all ('+np+')</button>':'';
  var L=T.filter(function(t){return tab==='all'||(tab==='pending'?pend(t)>0:pend(t)===0)});
  L.sort(function(a,b){return pend(b)-pend(a)||a.name.localeCompare(b.name)});
  if(!L.length){$('list').innerHTML='<div class="empty">'+(T.length?(tab==='pending'?'No rent due 🎉':'Nothing here'):'Add a tenant using “+ Tenant”')+'</div>';return}
  $('list').innerHTML=L.map(function(t){var s=status(t);
    return '<div class="t"><div class="r1"><div><div class="nm">'+esc(t.name)+'</div><div class="sub">Room '+esc(t.room||'–')+' · Rent '+inr(t.rent)+(paid(t)?' · Received '+inr(paid(t)):'')+'</div></div><span class="chip '+s[0]+'">'+s[1]+'</span></div><div class="act">'+
    (pend(t)>0?'<button class="wa" data-wa="'+t.id+'">WhatsApp</button>':'')+'<button class="p" data-pay="'+t.id+'">Mark paid</button><button data-ed="'+t.id+'">Edit</button></div></div>'}).join('');
}

$('prev').onclick=function(){mo--;if(mo<0){mo=11;yr--}render()};
$('next').onclick=function(){mo++;if(mo>11){mo=0;yr++}render()};
$('tabs').onclick=function(e){var t=e.target.dataset.t;if(t){tab=t;render()}};
function tById(id){return S.tenants.filter(function(t){return t.id===id})[0]}
$('list').onclick=function(e){
  var d=e.target.dataset;
  if(d.wa){var t=tById(d.wa);if(!phone(t.phone)){alert('Please add a phone number (Edit)');return}window.open(wa(t),'_blank','noopener')}
  if(d.pay){openPay(d.pay)}
  if(d.ed){openEdit(d.ed)}
};
$('bar').onclick=function(e){if(e.target.id==='remAll'){
  var P=S.tenants.filter(function(t){return pend(t)>0});
  $('allList').innerHTML=P.map(function(t){return '<div class="rem"><div><div class="nm">'+esc(t.name)+'</div><div class="sub">'+inr(pend(t))+'</div></div>'+(phone(t.phone)?'<a href="'+wa(t)+'" target="_blank" rel="noopener">Send</a>':'<span class="sub">no number</span>')+'</div>'}).join('');
  $('dAll').showModal()}};
$('allList').onclick=function(e){if(e.target.tagName==='A'){e.target.classList.add('sent');e.target.textContent='Sent ✓'}};
$('aClose').onclick=function(){$('dAll').close()};

function openEdit(id){editId=id||null;var t=id?tById(id):{name:'',room:'',phone:'',rent:''};
  $('eT').textContent=id?'Edit tenant':'New tenant';$('eName').value=t.name;$('eRoom').value=t.room;$('ePhone').value=t.phone;$('eRent').value=t.rent;
  $('eDel').style.visibility=id?'visible':'hidden';$('dEdit').showModal()}
$('add').onclick=function(){openEdit()};
$('eCan').onclick=function(){$('dEdit').close()};
$('eSave').onclick=function(){
  var n=$('eName').value.trim(),r=parseInt($('eRent').value,10);
  if(!n||!(r>0)){alert('Name and rent are required');return}
  var o={name:n,room:$('eRoom').value.trim(),phone:$('ePhone').value.trim(),rent:r};
  if(editId){Object.assign(tById(editId),o)}else{o.id='t'+Date.now().toString(36);S.tenants.push(o)}
  save();$('dEdit').close();render()};
$('eDel').onclick=function(){if(confirm('Delete this tenant?')){S.tenants=S.tenants.filter(function(t){return t.id!==editId});save();$('dEdit').close();render()}};

function openPay(id){payId=id;var t=tById(id);$('pT').textContent=t.name;
  $('pInfo').textContent=mname()+' · Rent '+inr(t.rent)+' · Received so far '+inr(paid(t));
  $('pAmt').value=paid(t)||t.rent;$('dPay').showModal()}
function setPaid(v){var m=mk();S.pay[m]=S.pay[m]||{};S.pay[m][payId]=Math.max(0,v||0);save();$('dPay').close();render()}
$('pCan').onclick=function(){$('dPay').close()};
$('pFull').onclick=function(){setPaid(tById(payId).rent)};
$('pSave').onclick=function(){setPaid(parseInt($('pAmt').value,10))};

$('set').onclick=function(){
  $('sPg').value=S.pg;
  $('sTpl').value=S.tpl;
  $('sPin').value=S.pin||'';
  $('dSet').showModal();
};
$('sPinSet').onclick=function(){
  var p=$('sPin').value.trim();
  if(p.length < 4){ alert('Please enter at least a 4-digit PIN'); return; }
  S.pin = p;
  save();
  alert('Master PIN set successfully! The app is now protected.');
};
$('sPinRem').onclick=function(){
  if(confirm('Remove PIN protection? Anyone opening this app will have direct access.')){
    S.pin = '';
    $('sPin').value = '';
    save();
    alert('PIN removed.');
  }
};
$('sCan').onclick=function(){$('dSet').close()};
$('sSave').onclick=function(){
  S.pg=$('sPg').value.trim()||DEF.pg;
  S.tpl=$('sTpl').value.trim()||DEF.tpl;
  if($('sPin').value.trim()) S.pin = $('sPin').value.trim();
  save();
  $('dSet').close();
  render();
};
$('sExp').onclick=function(){
  if(S.pin && prompt('Enter Master PIN to export data:') !== S.pin){ alert('Unauthorized'); return; }
  var j=JSON.stringify(S);
  if(navigator.clipboard){navigator.clipboard.writeText(j).then(function(){alert('Backup copied. Paste it somewhere safe.')},function(){prompt('Copy this text:',j)})}else prompt('Copy this text:',j);
};
$('sImp').onclick=function(){
  if(S.pin && prompt('Enter current Master PIN to restore data:') !== S.pin){ alert('Unauthorized'); return; }
  var j=prompt('Paste backup text here:');if(!j)return;
  try{var o=JSON.parse(j);if(!o.tenants)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),o);save();$('dSet').close();render();alert('Data restored!')}catch(e){alert('Invalid backup')};
};

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}
var dp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('inst').hidden=false});
$('inst').onclick=function(){if(dp){dp.prompt();dp=null;$('inst').hidden=true}};

checkLock();
render();
})();
</script>
</body>
</html>
